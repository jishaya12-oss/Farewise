<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b2a">
  <title>Log in — FareWise</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🧭 FareWise</a>
    <nav class="account-nav"><a href="{{ url_for('register') }}">Create account</a></nav>
  </header>
  <main class="container auth-container">
    <section class="search-card auth-card">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Log in to FareWise</h1>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<p class="{{ category }}" role="alert">{{ message }}</p>{% endfor %}
      {% endwith %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
        <button class="primary-button" type="submit">Log in</button>
      </form>
      <p class="microcopy">New to FareWise? <a href="{{ url_for('register') }}">Create a free account</a>.</p>
    </section>
  </main>
</body>
</html>
